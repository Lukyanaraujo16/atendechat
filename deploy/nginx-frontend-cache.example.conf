# Nginx — cache do frontend StreamHUB Chat (exemplo completo e válido)
#
# Copiar para sites-available e adaptar server_name/root/SSL.
# Validar na VPS: nginx -t && systemctl reload nginx
#
# Regras:
# - HTML e arquivos de controle: no-cache / no-store / must-revalidate
# - /static/* (hashes CRA): cache longo + immutable
# - /version.json e /service-worker.js NUNCA caem no SPA fallback
# - add_header repetido em cada location (Nginx não herda de forma confiável)

server {
    listen 443 ssl http2;
    server_name app.streamhubchat.com.br;

    # ssl_certificate     /etc/letsencrypt/live/app.streamhubchat.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.streamhubchat.com.br/privkey.pem;

    root /var/www/atendechat/frontend/build;
    index index.html;

    # --- Arquivos de controle (exact match; sem fallback SPA) ---

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    location = /asset-manifest.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.json {
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    location = /service-worker.js {
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Service-Worker-Allowed "/" always;
        expires -1;
        try_files $uri =404;
    }

    # --- Assets content-hashed do CRA ---

    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- SPA: rota / e paths sem arquivo ---
    # Fallback nomeado aplica no-cache ao index.html servido.

    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files /index.html =404;
    }
}
