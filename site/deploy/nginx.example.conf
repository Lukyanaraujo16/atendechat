# EXEMPLO — site institucional streamhubchat.com.br (estático, gerado por `npm run build` em site/).
# NÃO aplicar sem autorização. Não altera app.streamhubchat.com.br nem api.streamhubchat.com.br.
# Copiar para /etc/nginx/sites-available/streamhubchat-site, ajustar root/certificados,
# validar com `nginx -t` e recarregar com `systemctl reload nginx`.

# HTTP -> HTTPS (domínio principal e www)
server {
    listen 80;
    listen [::]:80;
    server_name streamhubchat.com.br www.streamhubchat.com.br;
    return 301 https://streamhubchat.com.br$request_uri;
}

# www -> domínio principal (canônico)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.streamhubchat.com.br;

    ssl_certificate     /etc/letsencrypt/live/streamhubchat.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/streamhubchat.com.br/privkey.pem;

    return 301 https://streamhubchat.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name streamhubchat.com.br;

    ssl_certificate     /etc/letsencrypt/live/streamhubchat.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/streamhubchat.com.br/privkey.pem;

    root /var/www/streamhubchat-site/current;
    index index.html;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Assets com hash no nome: cache longo e imutável
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML sempre revalidado para refletir novos deploys
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}
